apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskboard.fullname" . }}-grafana-dashboard
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: {{ include "taskboard.name" . }}
    helm.sh/chart: {{ include "taskboard.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  taskboard-telemetry.json: |-
{{ $.Files.Get "dashboards/taskboard-telemetry.json" | indent 4 }}
